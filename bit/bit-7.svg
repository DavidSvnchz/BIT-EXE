      <rect x="-1" y="7" width="2" height="1"/><rect x="-3" y="8" width="1" height="2"/>
      <rect x="11" y="7" width="2" height="1"/><rect x="14" y="8" width="1" height="2"/>
    </g>
    <!-- piernas -->
    <g fill="#C8F135">
      <rect x="4" y="11" width="2" height="2"/><rect x="2" y="13" width="2" height="2"/>
      <rect x="7" y="11" width="2" height="2"/><rect x="9" y="13" width="2" height="2"/>
    </g>
    <g fill="#FF3D7F">
      <rect x="1" y="15" width="4" height="1"/><rect x="8" y="15" width="4" height="1"/>
    </g>
  </g>
</svg>
