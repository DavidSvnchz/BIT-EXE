<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Bit 7/8 -->
  <g transform="translate(6 3)">
    <!-- antena -->
    <rect x="5" y="-1" width="1" height="1" fill="#FF3D7F"/>
    <!-- cabeza y cuerpo -->
    <g fill="#C8F135">
      <rect x="4" y="0" width="4" height="1"/>
      <rect x="3" y="1" width="1" height="1"/><rect x="8" y="1" width="1" height="1"/>
      <rect x="2" y="2" width="8" height="1"/>
      <rect x="1" y="3" width="10" height="6"/>
      <rect x="2" y="9" width="8" height="2"/>
    </g>
    <rect x="2" y="3" width="8" height="5" fill="#0A0812"/>
    <g fill="#33D6E6"><rect x="3" y="4" width="2" height="2"/><rect x="7" y="4" width="2" height="2"/></g>
    <rect x="4" y="7" width="4" height="1" fill="#FF3D7F"/>
    <rect x="3" y="9" width="6" height="2" fill="#2C264A"/>
    <!-- brazos -->
